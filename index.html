<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Race Boston</title>
  <meta name="description" content="Open-world driving game set in Boston, MA, built from OpenStreetMap data.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230c2340'/%3E%3Cpath d='M14 40l6-14h24l6 14v8h-6v-4H20v4h-6z' fill='%23bd3039'/%3E%3Ccircle cx='22' cy='42' r='4' fill='%23fff'/%3E%3Ccircle cx='42' cy='42' r='4' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="src/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js" } }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="hud" class="hidden">
    <div id="mission" class="panel hidden">
      <div class="m-title"></div>
      <div class="m-sub"></div>
      <div class="m-time"></div>
      <div class="m-extra"></div>
    </div>
    <div id="score" class="panel hidden"></div>
    <div id="toast"></div>
    <div id="center-msg"></div>
    <div id="street"><div class="s-name"></div><div class="s-area"></div></div>
    <div id="minimap-wrap">
      <canvas id="minimap" width="440" height="440"></canvas>
    </div>
    <div id="speedo">
      <div id="speed">0</div>
      <div id="unit">MPH</div>
      <div id="gear">D</div>
      <div id="boost"><div id="boost-fill"></div></div>
    </div>
    <div id="hint">Esc menu &middot; M map &middot; C camera &middot; drag to look &middot; G fly &middot; R reset &middot; N time of day</div>
  </div>

  <div id="bigmap" class="hidden">
    <canvas id="bigmap-canvas"></canvas>
    <div class="bigmap-help">Click to set a GPS waypoint &middot; Right-click to clear &middot; Scroll to zoom &middot; M or Esc to close</div>
  </div>

  <div id="touch" class="hidden">
    <div class="t-left">
      <button data-key="left" aria-label="Steer left">&#9664;</button>
      <button data-key="right" aria-label="Steer right">&#9654;</button>
    </div>
    <div class="t-right">
      <button data-key="handbrake" class="small" aria-label="Handbrake">HB</button>
      <button data-key="brake" aria-label="Brake">&#9660;</button>
      <button data-key="throttle" aria-label="Accelerate">&#9650;</button>
    </div>
    <button id="t-menu" data-key="menu" aria-label="Menu">&#9776;</button>
  </div>

  <div id="menu" class="hidden"></div>

  <div id="loading">
    <div class="brand">
      <div class="brand-top">RACE</div>
      <div class="brand-bottom">BOSTON</div>
    </div>
    <div class="bar"><div id="load-bar"></div></div>
    <div id="load-text">Loading map&hellip;</div>
  </div>

  <div id="attribution">Map data &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors &middot; elevation: <a href="https://www.usgs.gov/3d-elevation-program" target="_blank" rel="noopener">USGS 3DEP</a></div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
